name: Crypto Arbitrage Demo

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run demo scanner
        env:
          STARTING_BALANCE: "200"
          BOT_RUNTIME_MINUTES: "30"
          POLL_SECONDS: "15"
          MIN_SPREAD_PCT: "0.30"
        run: python -u main.py

      - name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-arbitrage-demo-report
          path: |
            opportunities.csv
            demo_report.txt
          if-no-files-found: warn
          retention-days: 7
